server:
  port: ${REVERSE_PROXY_APP_PORT}

spring:
  application:
    name: reverse-proxy-app
  cloud:
    gateway:
      routes:
        - id: auth-server
          uri: ${REVERSE_PROXY_APP_AUTHORIZATION_SERVER_URL}
          predicates:
            - Path=/auth/**

eureka:
  client:
    serviceUrl:
      defaultZone: ${REVERSE_PROXY_APP_DISCOVERY_SERVER_URL}
    instance:
      prefer-ip-address: true